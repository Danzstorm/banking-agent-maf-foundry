[project]
name = "banking-agent-maf-foundry"
version = "0.1.0"
description = "Agente bancario de Banco Andino Demo con MAF, Foundry y MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "faker>=30",
    "mssql-python>=1.17.0",
    "agent-framework-core>=1.24.0",
    "agent-framework-foundry>=1.16.0",
    "azure-identity>=1.27.0",
    "tenacity>=9.1.4,<9.2.0",
    "agent-framework-orchestrations>=1.4.1",
    "pyjwt[crypto]>=2.10",
    "msal>=1.31",
    "azure-keyvault-secrets>=4.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
knowledge = [
    "fpdf2>=2.9.0",
    "markdown>=3.11.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"mcp_server/seed.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Azure scenarios hit real Foundry + MCP: opt in with `uv run pytest -m azure`.
# Interactive ones need a human for the device code: `uv run pytest -m interactive -s`.
addopts = "-m 'not azure and not interactive'"
markers = [
    "contract: MCP contract tests over streamable HTTP (local, no Azure)",
    "azure: scenario tests against real Foundry and the deployed MCP server",
    "interactive: Azure end to end that needs a human device code sign-in (phase 5)",
]
