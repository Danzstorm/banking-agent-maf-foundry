[project]
name = "banking-agent-maf-foundry"
version = "0.1.0"
description = "Agente bancario de Banco Andino Demo con MAF, Foundry y MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "faker>=30",
    "mssql-python>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"mcp_server/seed.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "contract: MCP contract tests over streamable HTTP (local, no Azure)",
]
